[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
build_unflags = 
    -fuse-cxa-atexit
build_flags = 
    -Wno-error
check_tool = cppcheck
check_flags = 
    cppcheck: --enable=all --suppress=missingIncludeSystem

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<alarm.cpp> +<input.cpp>
build_flags = -std=c++11 -DUNIT_TESTING