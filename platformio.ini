[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
check_tool = cppcheck
check_flags =
    cppcheck: --enable=all --suppress=missingIncludeSystem

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<alarm.cpp> +<system_state.cpp>
build_flags = -std=c++11 -DUNIT_TESTING